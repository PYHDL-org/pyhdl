<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% feed_meta %}
</head>
<body>
    <header class="site-header">
        <div class="wrapper">
            <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
            <nav class="site-nav">
                <input type="checkbox" id="nav-trigger" class="nav-trigger" />
                <label for="nav-trigger">
                    <span class="menu-icon">
                        <svg viewBox="0 0 18 15" width="18px" height="15px">
                            <path fill="#424242" d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z"/>
                            <path fill="#424242" d="M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0c0-0.82,0.665-1.484,1.484-1.484 h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z"/>
                            <path fill="#424242" d="M18,13.516C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,12.031,18,12.696,18,13.516L18,13.516z"/>
                        </svg>
                    </span>
                </label>
                <div class="trigger">
                    <a class="page-link" href="{{ '/' | relative_url }}">Home</a>
                    <a class="page-link" href="{{ '/getting-started' | relative_url }}">Getting Started</a>
                    <a class="page-link" href="{{ '/usage' | relative_url }}">Usage</a>
                    <a class="page-link" href="{{ '/api-reference' | relative_url }}">API Reference</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <div class="wrapper">
            {{ content }}
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrapper">
            <h2 class="footer-heading">{{ site.title }}</h2>
            <div class="footer-col-wrapper">
                <div class="footer-col">
                    <p>{{ site.description }}</p>
                </div>
                <div class="footer-col">
                    <p>
                        <a href="https://github.com/{{ site.github_username }}">GitHub</a>
                        {% if site.twitter_username %}
                        | <a href="https://twitter.com/{{ site.twitter_username }}">Twitter</a>
                        {% endif %}
                    </p>
                    <p>© 2025 {{ site.title }}</p>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
